<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: url('../assets/img/img5.jpg') no-repeat center center fixed; /* Ajoutez votre image ici */
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: flex-start; /* Aligne les éléments en haut */
    height: 100vh;
    margin: 0;
    padding-top: 50px; /* Ajustez cette valeur pour déplacer le cadre plus ou moins en haut */
}

.container {
    background-color: rgba(255, 255, 255, 0.8); /* Couleur de fond avec transparence */
    padding: 20px;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    border: 1px solid #ccc;
    text-align: center;
}

h1 {
    color: #333;
    margin-bottom: 20px;
}

p {
    color: #555;
    margin-bottom: 30px;
}

button {
    padding: 10px 20px;
    background-color: #28a745; /* Vert */
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background-color: #218838; /* Vert foncé au survol */
}


</style>
</head>
<body>
  <div class="container">
    <h1>Bienvenue!</h1>
    <p>Maintenant vous etes un membre de notre bibliotheque H&H.</p>
    <button onclick="window.location.href='../utilisateur/index.html'">Voir les actions possibles</button> <br><br>
    <button onclick="window.location.href='../index.html'">Se deconnecter</button>
    </div>
</body>
</html>
