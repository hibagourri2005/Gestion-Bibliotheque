<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: url('../assets/img/img7.jpg') no-repeat center center fixed; /* Ajoutez votre image d'arrière-plan ici */
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: flex-start; /* Aligner légèrement vers le haut */

}

.login-container {
    background-color: rgba(255, 255, 255, 0.8); /* Couleur de fond avec transparence */
    padding: 20px;
    border-radius: 5px;

    text-align: center;
    width: 400px; /* Ajustez cette valeur pour la largeur du cadre */
}

form {
    display: flex;

}

label {
    margin: 10px 0 5px;

}

input {

    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 10px;
    background-color: #28a745; /* Vert */
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background-color: #218838; /* Vert foncé au survol */
}

.message-container {
    background-color: rgba(255, 255, 255, 0.8); /* Couleur de fond avec transparence */

}

<body>
    <div class="login-container">
        <form action="connexion-bibliothecaire.php" method="POST">
            <h2>Connexion</h2>
            <label for="nom_prenom">Nom Prénom:</label>
            <input type="text" id="nom_prenom" name="nom_prenom" required>
            <label for="password">Mot de passe:</label>
            <input type="password" id="password" name="password" required>
